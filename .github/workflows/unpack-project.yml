name: Extract LingoStep project archive # automated extraction

on:
  push:
    paths:
      - ".github/workflows/unpack-project.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Extract project files into repository root
        shell: bash
        run: |
          set -euo pipefail
          test -f LingoStep22-curriculum-v2.zip
          mkdir -p /tmp/lingostep-extract
          unzip -q -o LingoStep22-curriculum-v2.zip -d /tmp/lingostep-extract
          test -d /tmp/lingostep-extract/LingoStep22
          rsync -a --exclude='.github/workflows/' /tmp/lingostep-extract/LingoStep22/ ./
          rm -f LingoStep22-curriculum-v2.zip

      - name: Commit extracted files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted file changes to commit."
            exit 0
          fi
          git commit -m "Extract LingoStep project files from archive"
          git push
